; Ctrl + X controls aim tracking; telemetry records shots independently.
[aimlock]
enabled=false
max_distance=60
fov_radius=0.12
target_height=0.3
crosshair_x=0.53
crosshair_y=0.4
random_aim=true
random_interval_ms=300
random_seed=auto
telemetry_enabled=true
telemetry_match_window_ms=750
telemetry_flush_interval_ms=1000

[distribution]
torso=20
left_arm=20
right_arm=20
left_leg=15
right_leg=15
head=10
