; Ctrl + X: ON/OFF. Hold right mouse button to lock a player.
[aimlock]
enabled=false
max_distance=60
fov_radius=0.12
target_height=0.3
crosshair_x=0.53
crosshair_y=0.4
random_aim=true
random_interval_ms=300
random_seed=auto

; Weighted selection of aim points, not guaranteed hit/damage percentages.
[distribution]
torso=20
left_arm=20
right_arm=20
left_leg=15
right_leg=15
head=10
